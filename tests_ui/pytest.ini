[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --html=tests_ui/reports/report.html --self-contained-html
markers =
    smoke: fast, read-only checks that do not require an account
    regression: broader UI regression coverage
    authentication: sign-in and session behavior
    projects: project workspace behavior
    invoices: invoices and invoice-editor behavior
    payments: payment and billing UI behavior (no payment submission)
    client_portal: client portal behavior
    meetings: meeting and conferencing behavior
    workflows: workflow automation behavior
    permissions: route protection and permission behavior
    production_readonly: explicitly gated, non-mutating production owner checks
