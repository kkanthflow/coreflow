<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreFlow API Layer</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border-color: #1f2937;
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Subtle background animations */
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      right: -100px;
      z-index: 1;
    }

    .bg-glow-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(147, 197, 253, 0.1) 0%, rgba(0,0,0,0) 70%);
      bottom: -150px;
      left: -150px;
      z-index: 1;
    }
    
    .container {
      max-width: 600px;
      width: 90%;
      padding: 20px;
      z-index: 10;
    }
    
    .card {
      background-color: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 48px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      border-radius: 20px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
    }

    .logo-text {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -1px;
    }
    
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 12px;
      background: linear-gradient(to right, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .description {
      color: var(--text-muted);
      font-weight: 300;
      font-size: 1.1rem;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      background-color: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: #4ade80;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 32px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    
    .links {
      display: flex;
      justify-content: center;
      gap: 20px;
      border-top: 1px solid var(--border-color);
      padding-top: 24px;
    }
    
    a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    
    a:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>
  <div class="container">
    <div class="card">
      <div class="logo">
        <span class="logo-text">CF</span>
      </div>
      <h1>CoreFlow API Gateway</h1>
      <p class="description">Secure and production-ready middleware interface facilitating Android client synchronization and Supabase cloud operations.</p>
      
      <div class="status-badge">
        <div class="status-dot"></div>
        Operational
      </div>
      
      <div class="links">
        <a href="privacy.html">Privacy Policy</a>
        <span style="color: var(--border-color)">|</span>
        <a href="terms.html">Terms of Service</a>
        <span style="color: var(--border-color)">|</span>
        <a href="/api/health" target="_blank">API Status</a>
      </div>
    </div>
  </div>
</body>
</html>
